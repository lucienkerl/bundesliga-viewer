name: Deploy site

# Reusable: crawl.yml calls this when the crawl changed data (pushes made with GITHUB_TOKEN do not
# trigger other workflows). Also runs on code changes and manually.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
