name: Crawl DSB data

# Browsers cannot read bundesliga.dsb.de directly (CORS), so this job fetches the data
# and commits it as JSON.
#
# GitHub runs schedules on a best-effort basis: runs are often late by hours or skipped altogether, so the
# frequent cron below is only a fallback. For punctual runs an external scheduler can trigger this workflow
# every few minutes with mode=auto (see docs/EXTERNAL-TRIGGER.md).
#
# What a run does (crawler/should-crawl.ts):
# - Full crawl (league pages, seeding lists, club pages): the daily 05:30 UTC run and manual runs with mode=full.
# - Light crawl (league pages only, about 10 seconds): any other trigger, but only from 30 minutes before a
#   match start until 150 minutes after it. Outside that window the run ends after a few seconds.
# Cron times are UTC.
on:
  schedule:
    - cron: "*/15 7-19 * * 6,0"
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = crawl everything now, auto = only inside a match window (used by external triggers)"
        type: choice
        options: [full, auto]
        default: full
      refresh_clubs:
        description: Re-read club pages as well
        type: boolean
        default: false

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      # ref: main matters: without it a queued run checks out the commit from the time it was triggered and
      # then collides with the data commit of the run before it.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check match window
        id: gate
        env:
          FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode == 'full') || github.event.schedule == '30 5 * * *' }}
        run: npx tsx crawler/should-crawl.ts
      - name: Crawl
        if: steps.gate.outputs.run == 'true'
        run: npm run crawl -- ${{ steps.gate.outputs.full != 'true' && '--skip-setlists' || '' }} ${{ inputs.refresh_clubs && '--refresh-clubs' || '' }}
      - name: Commit changed data
        if: steps.gate.outputs.run == 'true'
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/commit-data.sh ${{ steps.gate.outputs.full != 'true' && '--skip-setlists' || '' }} ${{ inputs.refresh_clubs && '--refresh-clubs' || '' }}

  deploy:
    needs: crawl
    if: needs.crawl.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
